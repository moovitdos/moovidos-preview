<!DOCTYPE html>
<html lang="he" dir="rtl">
<!-- The discussion board. The page is static like the rest of the site; the messages live behind the API whose
     address is the "board-api" meta below (cloud/board in the code repository, a Cloudflare Worker; the copy that
     Worker serves itself says "/", cloud/board/scripts/stage.mjs). Served from localhost it talks to
     http://localhost:8787 (assets/board.js).
     The look is Material 3 (assets/board.css) in the colours of the site; the icons are Material Symbols. -->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מובידוס - רעיונות ודיונים</title>
  <meta name="description" content="הפורום של מובידוס: רעיונות לאפליקציה, שאלות ותקלות.">
  <meta name="robots" content="noindex">
  <meta name="board-api" content="https://moovidos-board.moovitdos.workers.dev">
  <!-- Only this site's own files run here; the board's API and Google's sign-in are the only other addresses. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:8787 https://moovidos-board.moovitdos.workers.dev; connect-src 'self' http://localhost:8787 https://moovidos-board.moovitdos.workers.dev https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self'; base-uri 'self'; form-action 'self'">

  <link rel="icon" href="logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Rubik: the site's typeface - the top bar and the footer are the site's own. Google Sans (on Google Fonts with
       Hebrew): the forum itself, its menus and its dialogs (board.css). On the site's other pages site.js loads
       Google Sans with the forum's script, only when the forum is used there. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400..700&family=Rubik:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="stylesheet" href="assets/board.css">
  <script src="assets/board-text.js" defer></script>
  <script src="assets/board.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div role="note" style="background:#FFF4E5;color:#5C3A00;font:14px/1.6 Rubik,system-ui,sans-serif;text-align:center;padding:4px 16px">אתר ניסיון — <a href="https://moovitdos.github.io/moovidos/" style="color:inherit;text-decoration:underline">האתר הרשמי כאן</a></div>
  <!-- the site's own download icon (the sprite of index.html), for the top bar; the forum's icons are in
       assets/board-icons.svg -->
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></symbol>
  </svg>

  <a href="#view" class="skip-link">דלג לדיונים</a>

  <header class="top">
    <div class="wrap">
      <a class="brand" href="./"><img src="logo.png" alt="" width="32" height="32"><span>מובידוס</span></a>
      <nav class="nav" aria-label="ניווט ראשי">
        <a href="./#info-section">מידע</a>
        <a href="./#features">תכונות</a>
        <a href="./#updates">עדכונים במייל</a>
        <a href="./#guide">מדריך</a>
        <a href="forum.html" aria-current="true">פורום</a>
        <a href="./#contact-section">צור קשר</a>
      </nav>
      <!-- the forum's account: "כניסה" for a visitor; for a member board.js draws the bell and the account's menu -->
      <div class="top__user" id="user"><button type="button" class="btn btn-quiet" data-act="auth" data-tab="login">כניסה</button></div>
      <a class="btn btn-primary" href="./#downloads">
        <svg class="ic" aria-hidden="true"><use href="#i-download"/></svg>הורדה
      </a>
    </div>
  </header>

  <main>
    <section class="board" id="board" data-view="loading">
      <div class="progress" id="progress" hidden><span></span></div>
      <div class="wrap">
        <div id="view" tabindex="-1"><p class="bstate">טוען…</p></div>
        <noscript><p class="banner banner--warn">הפורום צריך JavaScript פעיל בדפדפן.</p></noscript>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <a class="brand" href="./"><img src="logo.png" alt="" width="24" height="24"><span>מובידוס</span></a>
      <a href="mailto:moovitdos@gmail.com" class="ltr">moovitdos@gmail.com</a>
      <p>כל הזכויות שמורות</p>
    </div>
  </footer>

  <div id="float"></div>
  <div id="modal"></div>
  <div class="snack" id="toast" role="status" aria-live="polite"></div>
</body>

</html>
